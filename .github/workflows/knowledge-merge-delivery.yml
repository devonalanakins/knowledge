name: Deliver verified Knowledge merge receipt

on:
  push:
    branches: [main]

# Push on the protected default branch executes only trusted merged workflow
# code. No checkout, PR content execution, or privileged PR-target event.
# Repo protection and owner approval are still REQUIRED before secrets go live.
permissions:
  contents: read
  pull-requests: read
  id-token: write

jobs:
  capture:
    if: >-
      ${{ github.repository == 'devonalanakins/knowledge' &&
          vars.KNOWLEDGE_CAPTURE_DELIVERY_ACK == 'OWNER_APPROVED_GITHUB_CAPTURE_V1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    concurrency:
      group: knowledge-capture-${{ github.event.after }}
      cancel-in-progress: false
    steps:
      - name: Authenticate associated merged PRs and queue encrypted Knowledge receipts
        env:
          KNOWLEDGE_CAPTURE_DELIVERY_ACK: ${{ vars.KNOWLEDGE_CAPTURE_DELIVERY_ACK }}
          KNOWLEDGE_CAPTURE_INGRESS_URL: ${{ vars.KNOWLEDGE_CAPTURE_INGRESS_URL }}
          KNOWLEDGE_CAPTURE_AUTH_MODE: ${{ vars.KNOWLEDGE_CAPTURE_AUTH_MODE }}
          KNOWLEDGE_CAPTURE_SIGNING_SECRET: ${{ secrets.KNOWLEDGE_CAPTURE_SIGNING_SECRET }}
          GITHUB_READ_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {createHmac,createHash,randomUUID} from 'node:crypto';

          const reject=code=>{throw Error('KNOWLEDGE_MERGE_DELIVERY_'+code);};
          const slug='devonalanakins/knowledge',repoId=1446728034;
          const sha40=/^[0-9a-f]{40}$/;
          if(process.env.KNOWLEDGE_CAPTURE_DELIVERY_ACK!=='OWNER_APPROVED_GITHUB_CAPTURE_V1')
            reject('DISABLED');
          const endpoint=process.env.KNOWLEDGE_CAPTURE_INGRESS_URL;
          const signingSecret=process.env.KNOWLEDGE_CAPTURE_SIGNING_SECRET;
          const authMode=process.env.KNOWLEDGE_CAPTURE_AUTH_MODE;
          if(!['hmac_v1','github_oidc_v1'].includes(authMode))reject('AUTH_MODE_NOT_APPROVED');
          const githubToken=process.env.GITHUB_READ_TOKEN;
          let url;
          try{url=new URL(endpoint);}catch{reject('INVALID_ENDPOINT');}
          if(url.href!==endpoint||url.protocol!=='https:'||url.port||
             url.pathname!=='/github'||url.search||url.hash||
             url.username||url.password||
             !/^knowledge-capture-ingress-private\.[a-z0-9-]+\.workers\.dev$/.test(url.hostname))
            reject('INVALID_ENDPOINT');
          if(authMode==='hmac_v1'&&
             (typeof signingSecret!=='string'||Buffer.byteLength(signingSecret,'utf8')<32))
            reject('SIGNING_KEY_UNAVAILABLE');
          const oidcRequestUrl=process.env.ACTIONS_ID_TOKEN_REQUEST_URL;
          const oidcRequestToken=process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
          if(authMode==='github_oidc_v1'){
            let identityEndpoint;
            try{identityEndpoint=new URL(oidcRequestUrl);}catch{reject('OIDC_UNAVAILABLE');}
            if(identityEndpoint.protocol!=='https:'||identityEndpoint.port||
               !identityEndpoint.hostname.endsWith('.actions.githubusercontent.com')||
               typeof oidcRequestToken!=='string'||oidcRequestToken.length<16)
              reject('OIDC_UNAVAILABLE');
          }
          if(typeof githubToken!=='string'||githubToken.length<8)
            reject('GITHUB_READ_TOKEN_UNAVAILABLE');
          let event;
          try{event=JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH,'utf8'));}
          catch{reject('INVALID_EVENT');}
          const commits=event?.commits;
          if(process.env.GITHUB_EVENT_NAME!=='push'||
             process.env.GITHUB_REPOSITORY!==slug||
             process.env.GITHUB_REF!=='refs/heads/main'||
             event?.ref!=='refs/heads/main'||
             event?.repository?.id!==repoId||
             event.repository.full_name!==slug||
             event?.deleted!==false||event?.forced!==false||
             event?.created!==false||
             !sha40.test(event?.after??'')||
             event.after!==process.env.GITHUB_SHA||
             !Array.isArray(commits)||commits.length<1||commits.length>50||
             event.distinct_size!==commits.length||
             commits.at(-1)?.id!==event.after||
             commits.some(c=>!sha40.test(c?.id??''))||
             new Set(commits.map(c=>c.id)).size!==commits.length)
            reject('UNSUPPORTED_OR_UNTRUSTED_PUSH');

          const authenticated=new Map();
          for(const commit of commits){
            const api='https://api.github.com/repos/'+slug+
              '/commits/'+commit.id+'/pulls?per_page=100';
            let response,associated;
            try{
              response=await fetch(api,{method:'GET',redirect:'error',
                signal:AbortSignal.timeout(10000),
                headers:{'Accept':'application/vnd.github+json',
                  'Authorization':'Bearer '+githubToken,
                  'X-GitHub-Api-Version':'2026-03-10'}});
              if(response.status!==200)reject('GITHUB_LOOKUP_UNAVAILABLE');
              associated=await response.json();
            }catch{reject('GITHUB_LOOKUP_UNAVAILABLE');}
            if(!Array.isArray(associated)||associated.length>=100)
              reject('GITHUB_LOOKUP_INCOMPLETE');
            const eligible=associated.filter(pr=>
              pr?.state==='closed'&&
              typeof pr.merged_at==='string'&&
              Number.isFinite(Date.parse(pr.merged_at))&&
              pr.merge_commit_sha===commit.id&&
              Number.isSafeInteger(pr.number)&&pr.number>0&&
              pr.base?.ref==='main'&&
              pr.base?.repo?.id===repoId&&
              pr.base.repo.full_name===slug);
            if(eligible.length>1)reject('AMBIGUOUS_MERGE');
            if(eligible.length===1){
              const pr=eligible[0],prev=authenticated.get(pr.number);
              if(prev&&prev.merge_commit_sha!==pr.merge_commit_sha)
                reject('CONFLICTING_MERGE');
              authenticated.set(pr.number,pr);
            }
          }
          // A direct push is not a PR merge. An incomplete GitHub lookup is
          // never reported as an accepted receipt; API failures abort above.
          if(authenticated.size===0){
            console.log('No qualifying merged PR in this verified main push.');
          }
          for(const pr of authenticated.values()){
            const body=JSON.stringify({
              ...(authMode==='github_oidc_v1'?{knowledge_push_sha:event.after}:{}),
              action:'closed',number:pr.number,
              repository:{id:repoId,full_name:slug},
              pull_request:{number:pr.number,merged:true,
                merge_commit_sha:pr.merge_commit_sha,
                merged_at:pr.merged_at},
            });
            let proofHeader;
            if(authMode==='github_oidc_v1'){
              const digest=createHash('sha256').update(body,'utf8').digest('hex');
              let identityEndpoint,oidcResult;
              try{
                identityEndpoint=new URL(oidcRequestUrl);
                identityEndpoint.searchParams.set('audience',url.href+'#sha256='+digest);
                const tokenResponse=await fetch(identityEndpoint.href,{
                  method:'GET',redirect:'error',
                  signal:AbortSignal.timeout(10000),
                  headers:{Authorization:'Bearer '+oidcRequestToken,
                    Accept:'application/json'},
                });
                if(tokenResponse.status!==200)reject('OIDC_UNAVAILABLE');
                oidcResult=await tokenResponse.json();
              }catch{reject('OIDC_UNAVAILABLE');}
              if(typeof oidcResult?.value!=='string'||
                 oidcResult.value.length<128||oidcResult.value.length>8192)
                reject('OIDC_UNAVAILABLE');
              proofHeader={'X-Knowledge-Actions-OIDC':oidcResult.value};
            } else {
              proofHeader={'X-Hub-Signature-256':'sha256='+
                createHmac('sha256',signingSecret).update(body,'utf8').digest('hex')};
            }
            let delivered;
            try{
              delivered=await fetch(url.href,{method:'POST',redirect:'error',
                signal:AbortSignal.timeout(10000),
                headers:{'Content-Type':'application/json',
                  'X-GitHub-Event':'pull_request',
                  'X-GitHub-Delivery':randomUUID(),
                  ...proofHeader},
                body});
            }catch{reject('TRANSPORT_UNAVAILABLE');}
            if(delivered.status!==202)reject('NOT_ENQUEUED');
          }
          if(authenticated.size>0)
            console.log('Knowledge merge receipts durably queued (not yet saved): '+authenticated.size);
          NODE
