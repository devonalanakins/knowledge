name: Deliver verified Knowledge merge receipt

on:
  pull_request:
    types: [closed]

# This job NEVER checks out or executes code from a pull request.
# An independent private Cloudflare ingress must be reviewed and configured.
permissions: {}

jobs:
  capture:
    if: >-
      ${{ github.repository == 'devonalanakins/knowledge' &&
          github.event.action == 'closed' &&
          github.event.pull_request.merged == true &&
          vars.KNOWLEDGE_CAPTURE_DELIVERY_ACK == 'OWNER_APPROVED_GITHUB_CAPTURE_V1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    concurrency:
      group: knowledge-capture-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Send minimal authenticated merge receipt
        env:
          KNOWLEDGE_CAPTURE_DELIVERY_ACK: ${{ vars.KNOWLEDGE_CAPTURE_DELIVERY_ACK }}
          KNOWLEDGE_CAPTURE_INGRESS_URL: ${{ vars.KNOWLEDGE_CAPTURE_INGRESS_URL }}
          KNOWLEDGE_CAPTURE_SIGNING_SECRET: ${{ secrets.KNOWLEDGE_CAPTURE_SIGNING_SECRET }}
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {createHmac,randomUUID} from 'node:crypto';

          const reject=code=>{throw Error('KNOWLEDGE_MERGE_DELIVERY_'+code);};
          if(process.env.KNOWLEDGE_CAPTURE_DELIVERY_ACK!=='OWNER_APPROVED_GITHUB_CAPTURE_V1')
            reject('DISABLED');
          const endpoint=process.env.KNOWLEDGE_CAPTURE_INGRESS_URL;
          const secret=process.env.KNOWLEDGE_CAPTURE_SIGNING_SECRET;
          let url;
          try{url=new URL(endpoint);}catch{reject('INVALID_ENDPOINT');}
          if(url.href!==endpoint||url.protocol!=='https:'||url.port||
             url.pathname!=='/github'||url.search||url.hash||
             url.username||url.password||
             !/^knowledge-capture-ingress-private\.[a-z0-9-]+\.workers\.dev$/.test(url.hostname))
            reject('INVALID_ENDPOINT');
          if(typeof secret!=='string'||Buffer.byteLength(secret,'utf8')<32)
            reject('SIGNING_KEY_UNAVAILABLE');
          let e;
          try{e=JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH,'utf8'));}
          catch{reject('INVALID_EVENT');}
          const repo=e?.repository,pr=e?.pull_request;
          if(process.env.GITHUB_REPOSITORY!=='devonalanakins/knowledge'||
             e?.action!=='closed'||pr?.merged!==true||
             repo?.id!==1446728034||repo?.full_name!=='devonalanakins/knowledge'||
             !Number.isSafeInteger(e?.number)||e.number<1||
             pr.number!==e.number||!Number.isSafeInteger(pr.number)||
             !/^[0-9a-f]{40}$/.test(pr.merge_commit_sha??'')||
             typeof pr.merged_at!=='string'||
             !Number.isFinite(Date.parse(pr.merged_at)))
            reject('NOT_AUTHORIZED_EVENT');
          // Deliberately omit PR titles, descriptions, authors, comments,
          // branches, arbitrary URLs, identities and access credentials.
          const body=JSON.stringify({
            action:'closed',number:e.number,
            repository:{id:repo.id,full_name:repo.full_name},
            pull_request:{number:pr.number,merged:true,
              merge_commit_sha:pr.merge_commit_sha,merged_at:pr.merged_at},
          });
          const signature=createHmac('sha256',secret).update(body,'utf8').digest('hex');
          let response;
          try{
            response=await fetch(url.href,{method:'POST',redirect:'error',
              signal:AbortSignal.timeout(10000),
              headers:{'Content-Type':'application/json',
                'X-GitHub-Event':'pull_request',
                'X-GitHub-Delivery':randomUUID(),
                'X-Hub-Signature-256':'sha256='+signature},
              body,
            });
          }catch{reject('TRANSPORT_UNAVAILABLE');}
          // 202 means durable encrypted inbox acceptance, NOT Knowledge SAVED.
          if(response.status!==202)reject('NOT_ENQUEUED');
          console.log('Knowledge merge receipt durably queued (not yet saved).');
          NODE
