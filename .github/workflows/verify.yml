name: Verify Knowledge core
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check
      - run: npm test

  private-offline-container:
    name: G24 offline encrypted vault container isolation
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check offline launcher syntax
        run: bash -n ops/private-notion/run-offline.sh
      - name: Build offline container without private input data
        run: docker build --pull -f ops/private-notion/Dockerfile -t knowledge-private-offline:g24 .
      - name: Verify synthetic archive with isolated container
        run: node test/notion-private-offline-docker-smoke.mjs
