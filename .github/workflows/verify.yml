name: Verify Knowledge core
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check
      - name: Validate capture ingress and encrypted inbox modules
        run: |
          node --check src/forward-github-capture.mjs
          node --check src/forward-capture-inbox.mjs
          node --check src/worker-cloudflare-capture-ingress.mjs
          node --check src/forward-receipt-policy.mjs
          node --check src/forward-capture-machine-auth.mjs
          node --check src/worker-cloudflare-private-rpc.mjs
          node --check src/worker-cloudflare-capture-processor.mjs
          node --check src/worker-cloudflare-capture-canary.mjs
          node --check test/worker-cloudflare-capture-processor.test.mjs
          node --check test/worker-cloudflare-capture-ingress.test.mjs
      - run: npm test
      - name: Verify private Notion ZIP reconciliation with synthetic sources only
        run: python3 -m unittest discover -s test -p 'test_private_notion_zip_reconcile.py' -v
      - name: Verify private encrypted quarantine with synthetic sources only
        run: |
          python3 -m venv /tmp/knowledge-quarantine-ci
          /tmp/knowledge-quarantine-ci/bin/python -m pip install --disable-pip-version-check -r ops/private-notion/requirements-quarantine.txt
          /tmp/knowledge-quarantine-ci/bin/python -m unittest discover -s test -p 'test_private_notion_quarantine.py' -v
      - name: Verify encrypted quarantine recovery and CSV/media audit with synthetic sources only
        run: /tmp/knowledge-quarantine-ci/bin/python -m unittest discover -s test -p 'test_private_notion_quarantine_review.py' -v
      - name: Verify encrypted owner-local workspace proposals with synthetic sources only
        run: /tmp/knowledge-quarantine-ci/bin/python -m unittest discover -s test -p 'test_private_notion_scope_review.py' -v

  private-offline-container:
    name: G24 offline encrypted vault container isolation
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check offline launcher syntax
        run: bash -n ops/private-notion/run-offline.sh
      - name: Build offline container without private input data
        run: docker build --pull -f ops/private-notion/Dockerfile -t knowledge-private-offline:g24 .
      - name: Verify synthetic archive with isolated container
        run: node test/notion-private-offline-docker-smoke.mjs
