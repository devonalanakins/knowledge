name: Verify disabled Knowledge capture and owner RPC bundles
on:
  push:
    paths:
      - '.github/workflows/verify-capture-bundles.yml'
      - 'ops/private-forward/wrangler.capture-*.staged.json'
      - 'ops/private-forward/wrangler.owner-rpc.dryrun.json'
      - 'src/worker-cloudflare-capture-*.mjs'
      - 'src/worker-cloudflare-private*.mjs'
      - 'src/forward-capture-machine-auth.mjs'
      - 'src/forward-capture-*.mjs'
      - 'src/forward-github-capture.mjs'
      - 'src/forward-github-oidc.mjs'
      - 'test/forward-github-oidc.test.mjs'
      - '.github/workflows/knowledge-merge-delivery.yml'
      - 'src/forward-receipt-policy.mjs'
      - 'test/capture-bundle-dry-run.test.mjs'
      - 'test/capture-owner-rpc-bundle-config.test.mjs'
      - 'test/forward-capture-version-stage.test.mjs'
      - 'test/forward-capture-version-attestation.test.mjs'
      - 'src/forward-capture-version-attestation.mjs'
      - 'src/forward-capture-bound-guard.mjs'
      - 'ops/private-forward/guard-capture-bound.mjs'
      - 'ops/private-forward/wrangler.capture-processor.bound.json'
      - 'test/forward-capture-bound-guard.test.mjs'
      - 'src/forward-capture-credential-recovery.mjs'
      - 'ops/private-forward/capture-key-custody-cli.mjs'
      - 'test/forward-capture-credential-recovery.test.mjs'
      - 'ops/private-forward/stage-capture-version.mjs'
  pull_request:
    paths:
      - '.github/workflows/verify-capture-bundles.yml'
      - 'ops/private-forward/wrangler.capture-*.staged.json'
      - 'ops/private-forward/wrangler.owner-rpc.dryrun.json'
      - 'src/worker-cloudflare-capture-*.mjs'
      - 'src/worker-cloudflare-private*.mjs'
      - 'src/forward-capture-machine-auth.mjs'
      - 'src/forward-capture-*.mjs'
      - 'src/forward-github-capture.mjs'
      - 'src/forward-github-oidc.mjs'
      - 'test/forward-github-oidc.test.mjs'
      - '.github/workflows/knowledge-merge-delivery.yml'
      - 'src/forward-receipt-policy.mjs'
      - 'test/capture-bundle-dry-run.test.mjs'
      - 'test/capture-owner-rpc-bundle-config.test.mjs'
      - 'test/forward-capture-version-stage.test.mjs'
      - 'test/forward-capture-version-attestation.test.mjs'
      - 'src/forward-capture-version-attestation.mjs'
      - 'src/forward-capture-bound-guard.mjs'
      - 'ops/private-forward/guard-capture-bound.mjs'
      - 'ops/private-forward/wrangler.capture-processor.bound.json'
      - 'test/forward-capture-bound-guard.test.mjs'
      - 'src/forward-capture-credential-recovery.mjs'
      - 'ops/private-forward/capture-key-custody-cli.mjs'
      - 'test/forward-capture-credential-recovery.test.mjs'
      - 'ops/private-forward/stage-capture-version.mjs'
permissions:
  contents: read
jobs:
  capture-bundle-dry-run:
    name: Non-uploading ingress, processor and owner RPC bundles
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      NO_COLOR: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate disabled staging config and deployment guard
        run: |
          node --test test/forward-capture-credential-recovery.test.mjs
          node --test test/capture-nonpublic-staging-config.test.mjs test/forward-capture-staging-guard.test.mjs test/capture-owner-rpc-bundle-config.test.mjs test/forward-capture-version-stage.test.mjs test/forward-capture-version-attestation.test.mjs test/forward-capture-bound-guard.test.mjs
          node --check src/forward-capture-credential-recovery.mjs
          node --check ops/private-forward/capture-key-custody-cli.mjs
          node --check src/forward-capture-bound-guard.mjs
          node --check ops/private-forward/guard-capture-bound.mjs
          node --check src/forward-capture-version-attestation.mjs
          node --check src/forward-capture-version-stage.mjs
          node --check ops/private-forward/stage-capture-version.mjs
          node --check src/forward-github-oidc.mjs
          node --check src/worker-cloudflare-private-rpc.mjs
          node --check src/worker-cloudflare-capture-ingress.mjs
          node --check src/worker-cloudflare-capture-processor.mjs
      - name: Dry-run three bundles without credentials or upload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/knowledge-capture-bundles
          for component in ingress processor owner-rpc; do
            if [[ "$component" == "owner-rpc" ]]; then
              manifest="ops/private-forward/wrangler.owner-rpc.dryrun.json"
            else
              manifest="ops/private-forward/wrangler.capture-${component}.staged.json"
            fi
            npm exec --yes --package=wrangler@4.68.0 -- wrangler deploy \
              --dry-run \
              --config "$manifest" \
              --outdir "/tmp/knowledge-capture-bundles/${component}"
          done
      - name: Validate generated bundle shape (synthetic-only)
        env:
          KNOWLEDGE_CAPTURE_BUNDLE_CI: '1'
        run: node --test test/capture-bundle-dry-run.test.mjs
